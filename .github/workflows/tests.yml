name: tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt ruff==0.7.1
      - run: python -m unittest discover -s tests -q
      - run: python -m forecasting.multi_horizon --data data/era5_five_cities.csv --out artifacts/ci_era5_evaluation.json
      - run: python -m scripts.one_city_forecast_eval --data data/new_weather_data.csv --city Mashhad --out artifacts/forecast_eval.csv
      - run: ruff check forecasting tests/test_forecasting.py tests/test_dashboard_smoke.py tests/test_source_audit.py tests/test_multi_horizon.py tests/test_one_city_forecast_eval.py scripts/app.py scripts/generate_sample_data.py scripts/audit_open_meteo.py scripts/build_era5_dataset.py scripts/one_city_forecast_eval.py
      - run: ruff format --check forecasting tests/test_forecasting.py tests/test_dashboard_smoke.py tests/test_source_audit.py tests/test_multi_horizon.py tests/test_one_city_forecast_eval.py scripts/app.py scripts/generate_sample_data.py scripts/audit_open_meteo.py scripts/build_era5_dataset.py scripts/one_city_forecast_eval.py
