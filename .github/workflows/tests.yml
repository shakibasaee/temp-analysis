name: tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt ruff==0.7.1
      - run: python -m unittest discover -s tests -q
      - run: ruff check forecasting tests/test_forecasting.py tests/test_weather.py tests/test_open_meteo.py tests/test_dashboard_smoke.py scripts/app.py scripts/main.py scripts/model_config.py scripts/models/linear_regression.py scripts/processing_data/load_data.py tests/test_linear_regression.py
      - run: ruff format --check forecasting tests/test_forecasting.py tests/test_weather.py tests/test_open_meteo.py tests/test_dashboard_smoke.py scripts/main.py
